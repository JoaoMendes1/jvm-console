name: Deploy

# MODELO: desligado de propósito. Ligue só quando o servidor estiver pronto: pasta
# clonada na VPS, serviço no docker-compose do infra e os três secrets cadastrados
# no repositório (VPS_HOST, VPS_USER, VPS_SSH_KEY). Aí tire o # das três linhas do push.
on:
  # push:
  #   branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy na VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd ~/__SLUG__
            git pull origin main
            docker build -t __SLUG__ .
            cd ~/infra
            docker compose up -d --force-recreate __SLUG__
            docker image prune -f
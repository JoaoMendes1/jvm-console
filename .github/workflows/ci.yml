name: CI

# Roda a cada push na staging. Só com tudo verde a staging pode ir para a main.
on:
  push:
    branches: [staging]
  workflow_dispatch:

# O token que a Action recebe só lê o repositório: o CI não precisa escrever nada.
permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          # A versão do Node vem do "engines" do package.json: um fato, um lugar.
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - run: npm run build